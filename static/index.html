<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f7f4;--surface:#ffffff;--border:#d4e8e0;
  --accent:#059669;--accent-dim:#047857;--accent-soft:#d1fae5;--accent-faint:#f0fdf9;
  --text:#0f2b1f;--text2:#2d5a43;--muted:#6b8f7d;
  --pos:#059669;--neg:#dc2626;--neg-soft:#fef2f2;--neu:#92400e;--neu-soft:#fffbeb;
  --font:'Inter',system-ui,sans-serif;--r:10px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1a13;--surface:#0f2419;--border:#1a3d28;
  --text:#e8f5ef;--text2:#a3c9b4;--muted:#5a7a6d;
  --accent-soft:#052e16;--accent-faint:#0a1a13;
  --neg-soft:#2d0a0a;--neu-soft:#1c1500;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.15);
}}
:root[data-theme="dark"]{
  --bg:#0a1a13;--surface:#0f2419;--border:#1a3d28;
  --text:#e8f5ef;--text2:#a3c9b4;--muted:#5a7a6d;
  --accent-soft:#052e16;--accent-faint:#0a1a13;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* LAYOUT */
.page{display:grid;grid-template-columns:1fr 320px;min-height:100vh;}
@media(max-width:760px){.page{grid-template-columns:1fr;}}

/* MAIN */
.main{display:flex;flex-direction:column;align-items:center;padding:48px 32px 48px;gap:24px;}
@media(max-width:760px){.main{padding:32px 16px;}}

/* LOGO */
.logo{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:440px;}
.logo-mark{position:relative;width:96px;height:72px;}
.logo-name{font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--text);}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.3px;font-weight:400;}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:440px;box-shadow:var(--sh);}

/* TEXTAREA */
.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;display:block;}
textarea{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:12px 14px;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);resize:none;outline:none;transition:border-color .18s;height:96px;}
textarea:focus{border-color:var(--accent);}
.lang-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;min-height:20px;}
.lang-detected{font-size:11px;color:var(--muted);font-weight:500;}
.btn{width:100%;margin-top:12px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;letter-spacing:.1px;}
.btn:hover{background:var(--accent-dim);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* RESULT */
.result{display:none;width:100%;max-width:440px;}
.result-card{border-radius:var(--r);padding:22px 24px;border:1px solid transparent;}
.result-card.pos{background:var(--accent-faint);border-color:#a7f3d0;}
.result-card.neg{background:var(--neg-soft);border-color:#fecaca;}
.result-card.neu{background:var(--neu-soft);border-color:#fde68a;}
.result-label{font-size:26px;font-weight:700;line-height:1;margin-bottom:6px;}
.result-label.pos{color:var(--pos);}
.result-label.neg{color:var(--neg);}
.result-label.neu{color:var(--neu);}
.result-meaning{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.result-bar-track{background:rgba(0,0,0,.06);border-radius:4px;height:6px;overflow:hidden;margin-bottom:6px;}
.result-bar-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.result-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}

/* SIDEBAR */
.sidebar{border-left:1px solid var(--border);background:var(--surface);padding:32px 20px;display:flex;flex-direction:column;gap:0;}
@media(max-width:760px){.sidebar{border-left:none;border-top:1px solid var(--border);padding:24px 16px;}}
.sidebar-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:14px;}
.hist-empty{font-size:13px;color:var(--muted);line-height:1.6;}
.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-item{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:default;}
.hist-text{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.hist-footer{display:flex;align-items:center;justify-content:space-between;}
.hist-badge{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:4px;text-transform:uppercase;}
.hist-badge.pos{background:var(--accent-soft);color:var(--pos);}
.hist-badge.neg{background:#fee2e2;color:#991b1b;}
.hist-badge.neu{background:#fef3c7;color:#92400e;}
.hist-score{font-size:11px;color:var(--muted);font-weight:500;}
</style>
</head>
<body>

    <div class="logo">
