<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f7f4;--surface:#ffffff;--border:#d4e8e0;
  --accent:#059669;--accent-dim:#047857;--accent-soft:#d1fae5;--accent-faint:#f0fdf9;
  --text:#0f2b1f;--text2:#2d5a43;--muted:#6b8f7d;
  --pos:#059669;--neg:#dc2626;--neg-soft:#fef2f2;--neu:#92400e;--neu-soft:#fffbeb;
  --font:'Inter',system-ui,sans-serif;--r:10px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1a13;--surface:#0f2419;--border:#1a3d28;
  --text:#e8f5ef;--text2:#a3c9b4;--muted:#5a7a6d;
  --accent-soft:#052e16;--accent-faint:#0a1a13;
  --neg-soft:#2d0a0a;--neu-soft:#1c1500;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.15);
}}
:root[data-theme="dark"]{
  --bg:#0a1a13;--surface:#0f2419;--border:#1a3d28;
  --text:#e8f5ef;--text2:#a3c9b4;--muted:#5a7a6d;
  --accent-soft:#052e16;--accent-faint:#0a1a13;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

/* LAYOUT */
.page{display:grid;grid-template-columns:1fr 320px;min-height:100vh;}
@media(max-width:760px){.page{grid-template-columns:1fr;}}

/* MAIN */
.main{display:flex;flex-direction:column;align-items:center;padding:48px 32px 48px;gap:24px;}
@media(max-width:760px){.main{padding:32px 16px;}}

/* LOGO */
.logo{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:440px;}
.logo-mark{position:relative;width:96px;height:72px;}
.logo-name{font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--text);}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.3px;font-weight:400;}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:440px;box-shadow:var(--sh);}

/* TEXTAREA */
.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;display:block;}
textarea{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:12px 14px;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);resize:none;outline:none;transition:border-color .18s;height:96px;}
textarea:focus{border-color:var(--accent);}
.lang-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;min-height:20px;}
.lang-detected{font-size:11px;color:var(--muted);font-weight:500;}
.btn{width:100%;margin-top:12px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;letter-spacing:.1px;}
.btn:hover{background:var(--accent-dim);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* RESULT */
.result{display:none;width:100%;max-width:440px;}
.result-card{border-radius:var(--r);padding:22px 24px;border:1px solid transparent;}
.result-card.pos{background:var(--accent-faint);border-color:#a7f3d0;}
.result-card.neg{background:var(--neg-soft);border-color:#fecaca;}
.result-card.neu{background:var(--neu-soft);border-color:#fde68a;}
.result-label{font-size:26px;font-weight:700;line-height:1;margin-bottom:6px;}
.result-label.pos{color:var(--pos);}
.result-label.neg{color:var(--neg);}
.result-label.neu{color:var(--neu);}
.result-meaning{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.result-bar-track{background:rgba(0,0,0,.06);border-radius:4px;height:6px;overflow:hidden;margin-bottom:6px;}
.result-bar-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.result-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}

/* SIDEBAR */
.sidebar{border-left:1px solid var(--border);background:var(--surface);padding:32px 20px;display:flex;flex-direction:column;gap:0;}
@media(max-width:760px){.sidebar{border-left:none;border-top:1px solid var(--border);padding:24px 16px;}}
.sidebar-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:14px;}
.hist-empty{font-size:13px;color:var(--muted);line-height:1.6;}
.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-item{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:default;}
.hist-text{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.hist-footer{display:flex;align-items:center;justify-content:space-between;}
.hist-badge{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:4px;text-transform:uppercase;}
.hist-badge.pos{background:var(--accent-soft);color:var(--pos);}
.hist-badge.neg{background:#fee2e2;color:#991b1b;}
.hist-badge.neu{background:#fef3c7;color:#92400e;}
.hist-score{font-size:11px;color:var(--muted);font-weight:500;}
</style>
</head>
<body>
<div class="page">

  <!-- MAIN -->
  <div class="main">
    <div class="logo">
      <div class="logo-mark">
        <svg width="96" height="72" viewBox="0 0 96 72" fill="none">
          <!-- Wallet body -->
          <rect x="4" y="20" width="88" height="48" rx="9" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
          <!-- Wallet flap (top) -->
          <path d="M4 29 Q4 20 13 20 L83 20 Q92 20 92 29 L92 34 L4 34 Z" fill="var(--accent)" opacity=".15"/>
          <path d="M13 20 L83 20 Q92 20 92 29 L92 32 L4 32 L4 29 Q4 20 13 20Z" stroke="var(--accent)" stroke-width="1.2" fill="none" opacity=".4"/>
          <!-- Coin pocket -->
          <rect x="58" y="37" width="28" height="22" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2" opacity=".9"/>
          <!-- Coin slot line -->
          <line x1="66" y1="48" x2="78" y2="48" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
          <!-- Card lines inside wallet -->
          <rect x="10" y="39" width="34" height="3" rx="1.5" fill="var(--border)"/>
          <rect x="10" y="46" width="24" height="3" rx="1.5" fill="var(--border)"/>
          <rect x="10" y="53" width="28" height="3" rx="1.5" fill="var(--border)"/>
        </svg>
      </div>
      <div class="logo-name">Folio</div>
      <div class="logo-sub">Analyse de sentiment financier</div>
    </div>

    <div class="card">
      <label class="field-label">Texte à analyser</label>
      <textarea id="inp" placeholder="Ex : Les résultats de LVMH dépassent les attentes du marché..."></textarea>
      <div class="lang-row">
        <span class="lang-detected" id="lang-detected"></span>
      </div>
      <button class="btn" id="btn" onclick="analyse()">Analyser</button>
    </div>

    <div class="result" id="result">
      <div class="result-card" id="result-card">
        <div class="result-label" id="r-label"></div>
        <div class="result-meaning" id="r-meaning"></div>
        <div class="result-bar-track">
          <div class="result-bar-fill" id="r-bar"></div>
        </div>
        <div class="result-meta">
          <span id="r-lang-line"></span>
          <span id="r-pct"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-title">Historique</div>
    <div class="hist-empty" id="hist-empty">Les analyses apparaîtront ici.</div>
    <div class="hist-list" id="hist-list"></div>
  </div>

</div>

<script>
const LANG_NAMES = {
  fr: 'Français',
  en: 'Anglais',
  de: 'Allemand',
  es: 'Espagnol',
  it: 'Italien',
};

const LABELS = {
  positive: {
    fr: { label: 'Positif',  meaning: 'Signal haussier, sentiment favorable aux marchés' },
    en: { label: 'Positive', meaning: 'Bullish signal, favorable market sentiment' },
    de: { label: 'Positiv',  meaning: 'Positives Signal, günstiges Marktsentiment' },
    es: { label: 'Positivo', meaning: 'Señal alcista, sentimiento favorable al mercado' },
    it: { label: 'Positivo', meaning: 'Segnale rialzista, sentiment di mercato favorevole' },
  },
  negative: {
    fr: { label: 'Négatif',  meaning: 'Signal baissier, sentiment défavorable aux marchés' },
    en: { label: 'Negative', meaning: 'Bearish signal, unfavorable market sentiment' },
    de: { label: 'Negativ',  meaning: 'Negatives Signal, ungünstiges Marktsentiment' },
    es: { label: 'Negativo', meaning: 'Señal bajista, sentimiento desfavorable al mercado' },
    it: { label: 'Negativo', meaning: 'Segnale ribassista, sentiment di mercato sfavorevole' },
  },
  neutral: {
    fr: { label: 'Neutre',  meaning: 'Pas de signal directionnel clair' },
    en: { label: 'Neutral', meaning: 'No clear directional signal' },
    de: { label: 'Neutral', meaning: 'Kein klares Richtungssignal' },
    es: { label: 'Neutral', meaning: 'Sin señal direccional clara' },
    it: { label: 'Neutro',  meaning: 'Nessun segnale direzionale chiaro' },
  },
};

const CONF_LABEL = {
  fr: 'Niveau de confiance',
  en: 'Confidence level',
  de: 'Konfidenzniveau',
  es: 'Nivel de confianza',
  it: 'Livello di confidenza',
};

const LANG_LABEL = {
  fr: lang => `Langue détectée : ${LANG_NAMES[lang] || lang}`,
  en: lang => `Detected language: ${LANG_NAMES[lang] || lang}`,
  de: lang => `Erkannte Sprache: ${LANG_NAMES[lang] || lang}`,
  es: lang => `Idioma detectado: ${LANG_NAMES[lang] || lang}`,
  it: lang => `Lingua rilevata: ${LANG_NAMES[lang] || lang}`,
};

const BAR_COLOR = { positive: '#059669', negative: '#dc2626', neutral: '#d97706' };
const CARD_CLASS = { positive: 'pos', negative: 'neg', neutral: 'neu' };

let history = [];

async function analyse() {
  const text = document.getElementById('inp').value.trim();
  if (!text) return;
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Analyse en cours...';
  try {
    const res = await fetch('/api/sentiment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error('Erreur serveur');
    const data = await res.json();
    showResult(data);
    addHistory(data);
  } catch(e) {
    btn.textContent = 'Erreur, réessayez';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Analyser'; }, 2000);
    return;
  }
  btn.disabled = false;
  btn.textContent = 'Analyser';
}

function showResult(data) {
  const lang = data.lang || 'fr';
  const sentimentKey = data.label;
  const langLabels = LABELS[sentimentKey]?.[lang] || LABELS[sentimentKey]?.en || LABELS.neutral.en;
  const pct = Math.round(data.score * 100);
  const cls = CARD_CLASS[sentimentKey] || 'neu';
  const confText = CONF_LABEL[lang] || CONF_LABEL.en;
  const langLine = (LANG_LABEL[lang] || LANG_LABEL.en)(lang);

  const labelEl = document.getElementById('r-label');
  labelEl.textContent = langLabels.label;
  labelEl.className = 'result-label ' + cls;

  document.getElementById('r-meaning').textContent = langLabels.meaning;
  document.getElementById('r-bar').style.width = pct + '%';
  document.getElementById('r-bar').style.background = BAR_COLOR[sentimentKey] || '#6b7280';
  document.getElementById('r-pct').textContent = confText + ' : ' + pct + '%';
  document.getElementById('r-lang-line').textContent = langLine;

  const card = document.getElementById('result-card');
  card.className = 'result-card ' + cls;

  document.getElementById('lang-detected').textContent = LANG_NAMES[lang] ? 'Langue : ' + LANG_NAMES[lang] : '';

  document.getElementById('result').style.display = 'block';
}

function addHistory(data) {
  const lang = data.lang || 'fr';
  const sentimentKey = data.label;
  const langLabels = LABELS[sentimentKey]?.[lang] || LABELS[sentimentKey]?.en;
  const pct = Math.round(data.score * 100);
  const cls = CARD_CLASS[sentimentKey] || 'neu';

  history.unshift({ text: data.text, label: langLabels?.label || sentimentKey, cls, score: pct });
  if (history.length > 8) history.pop();

  document.getElementById('hist-empty').style.display = 'none';
  document.getElementById('hist-list').innerHTML = history.map(h => `
    <div class="hist-item">
      <div class="hist-text">${h.text}</div>
      <div class="hist-footer">
        <span class="hist-badge ${h.cls}">${h.label}</span>
        <span class="hist-score">${h.score}%</span>
      </div>
    </div>`).join('');
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) analyse();
});
</script>
</body>
</html>
