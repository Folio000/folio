<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f7f4;--surface:#fff;--border:#d4e8e0;
  --accent:#059669;--accent-dim:#047857;--accent-soft:#d1fae5;--accent-faint:#f0fdf9;
  --text:#0f2b1f;--text2:#2d5a43;--muted:#6b8f7d;
  --pos:#059669;--pos-bg:#f0fdf9;--pos-border:#a7f3d0;
  --neg:#dc2626;--neg-bg:#fef2f2;--neg-border:#fecaca;
  --neu:#92400e;--neu-bg:#fffbeb;--neu-border:#fde68a;
  --font:'Inter',system-ui,sans-serif;--r:10px;
  --sh:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1a13;--surface:#0f2419;--border:#1a3d28;
  --text:#e8f5ef;--text2:#a3c9b4;--muted:#5a7a6d;
  --accent-soft:#052e16;--accent-faint:#0a1a13;
  --pos-bg:#052e16;--pos-border:#065f46;
  --neg-bg:#2d0a0a;--neg-border:#7f1d1d;
  --neu-bg:#1c1500;--neu-border:#78350f;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.15);
}}
:root[data-theme="dark"]{
  --bg:#0a1a13;--surface:#0f2419;--border:#1a3d28;
  --text:#e8f5ef;--text2:#a3c9b4;--muted:#5a7a6d;
  --accent-soft:#052e16;--accent-faint:#0a1a13;
  --pos-bg:#052e16;--pos-border:#065f46;
  --neg-bg:#2d0a0a;--neg-border:#7f1d1d;
  --sh:0 1px 3px rgba(0,0,0,.2),0 4px 16px rgba(0,0,0,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

.page{display:grid;grid-template-columns:1fr 300px;min-height:100vh;}
@media(max-width:800px){.page{grid-template-columns:1fr;}}

.main{display:flex;flex-direction:column;align-items:center;padding:44px 28px;gap:20px;}
@media(max-width:800px){.main{padding:28px 16px;}}

/* LOGO */
.logo{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:480px;}
.logo-name{font-size:26px;font-weight:700;letter-spacing:-0.8px;}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.2px;}

/* INPUT CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;width:100%;max-width:480px;box-shadow:var(--sh);}
.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;display:block;}
textarea{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:12px 14px;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);resize:none;outline:none;transition:border-color .18s;height:90px;}
textarea:focus{border-color:var(--accent);}
.input-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;min-height:18px;}
.lang-tag{font-size:11px;color:var(--muted);font-weight:500;}
.hint{font-size:11px;color:var(--muted);}
.btn{width:100%;margin-top:12px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--accent-dim);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* RAPPORT */
.rapport{display:none;width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;}
.rapport{display:none;}

/* SENTIMENT BLOCK */
.sent-card{border-radius:var(--r);padding:20px 22px;border:1px solid transparent;}
.sent-card.pos{background:var(--pos-bg);border-color:var(--pos-border);}
.sent-card.neg{background:var(--neg-bg);border-color:var(--neg-border);}
.sent-card.neu{background:var(--neu-bg);border-color:var(--neu-border);}
.sent-label{font-size:24px;font-weight:700;line-height:1;margin-bottom:5px;}
.sent-label.pos{color:var(--pos);}
.sent-label.neg{color:var(--neg);}
.sent-label.neu{color:var(--neu);}
.sent-meaning{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:14px;}
.bar-track{background:rgba(0,0,0,.07);border-radius:4px;height:5px;overflow:hidden;margin-bottom:6px;}
.bar-fill{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.sent-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}

/* MARKET CARD */
.mkt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh);}
.mkt-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.mkt-name{font-size:15px;font-weight:700;line-height:1.3;}
.mkt-ticker{font-size:11px;color:var(--muted);margin-top:2px;font-family:monospace;letter-spacing:.3px;}
.mkt-price-block{text-align:right;}
.mkt-price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
.mkt-change{font-size:13px;font-weight:600;margin-top:2px;}
.mkt-change.up{color:var(--pos);}
.mkt-change.down{color:var(--neg);}
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.mkt-kpi{background:var(--bg);border-radius:7px;padding:10px 12px;}
.mkt-kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px;}
.mkt-kpi-val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.range-wrap{margin-top:4px;}
.range-lbl{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px;font-variant-numeric:tabular-nums;}
.range-track{background:var(--border);border-radius:4px;height:4px;position:relative;}
.range-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);}
.mkt-sector{font-size:11px;color:var(--muted);margin-top:12px;}

/* SIDEBAR */
.sidebar{border-left:1px solid var(--border);background:var(--surface);padding:28px 18px;}
@media(max-width:800px){.sidebar{border-left:none;border-top:1px solid var(--border);padding:20px 16px;}}
.sidebar-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:14px;}
.hist-empty{font-size:13px;color:var(--muted);line-height:1.6;}
.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-item{padding:11px 13px;border:1px solid var(--border);border-radius:8px;cursor:default;}
.hist-text{font-size:12px;color:var(--text);line-height:1.45;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-o

    addHistory(data);
  }catch(e){
    btn.textContent='Erreur, réessayez';
    setTimeout(()=>{btn.disabled=false;btn.textContent='Analyser';},2000);
    return;
  }
  btn.disabled=false;btn.textContent='Analyser';
}

function showRapport(d){
  const lang=d.lang||'fr';
  const lbl=(LABELS[d.label]||LABELS.neutral)[lang]||(LABELS[d.label]||LABELS.neutral).en;
  const pct=Math.round(d.score*100);
  const cls=CLS[d.label]||'neu';

  document.getElementById('s-label').textContent=lbl.label;
  document.getElementById('s-label').className='sent-label '+cls;
  document.getElementById('s-meaning').textContent=lbl.meaning;
  document.getElementById('s-bar').style.width=pct+'%';
  document.getElementById('s-bar').style.background=BAR_C[d.label]||'#6b7280';
  document.getElementById('s-lang').textContent=(LANG_LABEL[lang]||LANG_LABEL.en)(lang);
  document.getElementById('s-conf').textContent=(CONF[lang]||CONF.en)+' : '+pct+'%';
  document.getElementById('sent-card').className='sent-card '+cls;
  document.getElementById('lang-tag').textContent='';

  const mkt=d.market;
  if(mkt){
    const kl=KPI_LBL[lang]||KPI_LBL.en;
    document.getElementById('m-name').textContent=mkt.name||d.ticker;
    document.getElementById('m-ticker').textContent=d.ticker;
    document.getElementById('m-price').textContent=mkt.price+' '+(mkt.currency||'');
    const chEl=document.getElementById('m-change');
    const sign=mkt.change_pct>=0?'+':'';
    chEl.textContent=sign+mkt.change_pct+'%';
    chEl.className='mkt-change '+(mkt.change_pct>=0?'up':'down');

    const grid=document.getElementById('m-grid');
    grid.innerHTML=[
      {l:kl.mc,v:fmt(mkt.market_cap,mkt.currency)},
      {l:kl.pe,v:mkt.pe_ratio?mkt.pe_ratio.toFixed(1):'—'},
      {l:kl.vol,v:fmtVol(mkt.volume)},
      {l:kl.sector,v:mkt.sector||'—'},
    ].map(k=>`<div class="mkt-kpi"><div class="mkt-kpi-lbl">${k.l}</div><div class="mkt-kpi-val">${k.v}</div></div>`).join('');

    if(mkt.week52_low&&mkt.week52_high){
      const lo=mkt.week52_low,hi=mkt.week52_high,cur=mkt.price;
      const pos=Math.min(100,Math.max(0,((cur-lo)/(hi-lo))*100));
      document.getElementById('m-52l').textContent=lo.toFixed(2)+' '+mkt.currency;
      document.getElementById('m-52h').textContent=hi.toFixed(2)+' '+mkt.currency;
      document.getElementById('m-dot').style.left=pos+'%';
      document.getElementById('m-range-wrap').style.display='block';
    }else{
      document.getElementById('m-range-wrap').style.display='none';
    }
    document.getElementById('m-sector').textContent=mkt.sector||'';
    document.getElementById('mkt-card').style.display='block';
  }else{
    document.getElementById('mkt-card').style.display='none';
  }
  document.getElementById('rapport').style.display='flex';
  document.getElementById('rapport').style.flexDirection='column';
  document.getElementById('rapport').style.gap='14px';
}

function addHistory(d){
  const lang=d.lang||'fr';
  const lbl=(LABELS[d.label]||LABELS.neutral)[lang]||(LABELS[d.label]||LABELS.neutral).en;
  const pct=Math.round(d.score*100);
  history.unshift({text:d.text,label:lbl.label,cls:CLS[d.label]||'neu',score:pct,ticker:d.ticker});
  if(history.length>8)history.pop();
  document.getElementById('hist-empty').style.display='none';
  document.getElementById('hist-list').innerHTML=history.map(h=>`
    <div class="hist-item">
      <div class="hist-text">${h.text}</div>
      <div class="hist-footer">
        <span class="hist-badge ${h.cls}">${h.label}</span>
        ${h.ticker?`<span class="hist-ticker">${h.ticker}</span>`:''}
        <span class="hist-score">${h.score}%</span>
      </div>
    </div>`).join('');
}

document.getElementById('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))analyse();
});
</script>
